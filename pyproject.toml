[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-thesis"
version = "0.9.0"
description = "An open-source agentic system that challenges investment theses with new company evidence."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Matt Su" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi>=0.116,<1",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "openai>=1.100,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "qdrant-client>=1.15,<2",
  "rank-bm25>=0.2.2,<1",
  "tiktoken>=0.11,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
]

[project.scripts]
agentic-thesis = "agentic_thesis.cli:main"

[project.urls]
Homepage = "https://github.com/suvimatt/agentic-thesis"
Repository = "https://github.com/suvimatt/agentic-thesis"
Issues = "https://github.com/suvimatt/agentic-thesis/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_thesis = [
  "index.html",
  "sample_data/*.json",
  "sample_data/filings/*.html",
]
