# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["version"]

          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]

          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} must equal {expected!r}"
              )
          PY

      - name: Install build and test dependencies
        run: python -m pip install build twine ".[test]"

      - name: Run deterministic tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Verify generated OpenAPI schema
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

      - name: Build release distributions
        run: python -m build

      - name: Validate release distributions
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/agentic-thesis-wheel
          /tmp/agentic-thesis-wheel/bin/python -m pip install dist/*.whl
          /tmp/agentic-thesis-wheel/bin/python -c \
            "from agentic_thesis import AgenticThesisEngine"
          /tmp/agentic-thesis-wheel/bin/agentic-thesis --help

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  docs-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm --prefix docs ci

      - name: Build documentation
        run: npm --prefix docs run build

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build, docs-build]

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/agentic-thesis

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
