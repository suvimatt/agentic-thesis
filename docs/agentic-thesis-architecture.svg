<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentic-thesis-architecture-title agentic-thesis-architecture-desc">
  <title id="agentic-thesis-architecture-title">AgenticThesis v1.0 alpha system architecture</title>
  <desc id="agentic-thesis-architecture-desc">Architecture showing an SEC event preserved as immutable source artifacts, routed through a Radar decision, transformed into exact evidence, reviewed by a human, and committed as an auditable thesis revision.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#667069"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#276749"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect width="1280" height="760" fill="#f6f8f4"/>

  <!-- Zones -->
  <rect x="40" y="48" width="1200" height="144" rx="8" fill="rgba(23,32,25,.02)" stroke="rgba(23,32,25,.12)" stroke-width=".8"/>
  <rect x="64" y="52" width="160" height="16" rx="2" fill="#f6f8f4"/>
  <text x="144" y="64" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".14em">SOURCES + COLLECTION</text>

  <rect x="280" y="232" width="960" height="304" rx="8" fill="rgba(23,32,25,.02)" stroke="rgba(23,32,25,.12)" stroke-width=".8"/>
  <rect x="304" y="236" width="144" height="16" rx="2" fill="#f6f8f4"/>
  <text x="376" y="248" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".14em">LANGGRAPH WORKFLOW</text>

  <rect x="280" y="568" width="960" height="128" rx="8" fill="rgba(23,32,25,.02)" stroke="rgba(23,32,25,.12)" stroke-width=".8"/>
  <rect x="304" y="572" width="112" height="16" rx="2" fill="#f6f8f4"/>
  <text x="360" y="584" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".14em">DURABLE STATE</text>

  <!-- Connectors -->
  <line x1="280" y1="128" x2="320" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <path d="M 140,280 V 232 Q 140,224 148,224 H 352 Q 360,224 360,216 V 168" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="420" y1="168" x2="420" y2="280" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 560,148 H 1248 Q 1256,148 1256,156 V 624 Q 1256,632 1248,632 H 1200" fill="none" stroke="#667069" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="240" y1="328" x2="320" y2="328" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <line x1="520" y1="328" x2="560" y2="328" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="760" y1="328" x2="800" y2="328" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="328" x2="1040" y2="328" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="376" x2="1120" y2="432" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="512" x2="1040" y2="592" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="592" x2="1120" y2="512" stroke="#667069" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 320,640 H 272 Q 264,640 264,632 V 400 Q 264,392 256,392 H 148 Q 140,392 140,384 V 376" fill="none" stroke="#667069" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Connector labels -->
  <rect x="220" y="204" width="72" height="12" rx="2" fill="#f6f8f4"/>
  <text x="256" y="212" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">FETCH + HASH</text>
  <rect x="432" y="208" width="72" height="12" rx="2" fill="#f6f8f4"/>
  <text x="468" y="216" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">BOUND FILING</text>
  <rect x="1168" y="200" width="80" height="12" rx="2" fill="#f6f8f4"/>
  <text x="1208" y="208" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">EVENT + ARTIFACT</text>
  <rect x="248" y="304" width="64" height="12" rx="2" fill="#f6f8f4"/>
  <text x="280" y="312" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">ASYNC RUN</text>
  <rect x="948" y="536" width="80" height="12" rx="2" fill="#f6f8f4"/>
  <text x="988" y="544" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">CAS COMMIT</text>
  <rect x="1132" y="552" width="56" height="12" rx="2" fill="#f6f8f4"/>
  <text x="1160" y="560" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">RESUME</text>
  <rect x="168" y="520" width="88" height="12" rx="2" fill="#f6f8f4"/>
  <text x="212" y="528" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">RUNS + EVENTS</text>

  <!-- Collection invariant -->
  <text x="640" y="112" fill="#276749" font-size="16" font-style="italic" font-family="ui-serif,Georgia,serif">Every event preserves its original artifacts before interpretation.</text>
  <text x="640" y="136" fill="#667069" font-size="16" font-style="italic" font-family="ui-serif,Georgia,serif">Every analysis run still names exactly one disclosure.</text>

  <!-- Node 1: Sources -->
  <rect x="40" y="88" width="240" height="80" rx="6" fill="#f6f8f4"/>
  <rect x="40" y="88" width="240" height="80" rx="6" fill="rgba(23,32,25,.03)" stroke="rgba(23,32,25,.30)" stroke-width="1"/>
  <rect x="52" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.30)" stroke-width=".8"/>
  <text x="68" y="108" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DATA</text>
  <text x="160" y="132" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">SEC Filing Events</text>
  <text x="160" y="152" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">recent + history · CIK + accession</text>

  <!-- Node 2: Collection -->
  <rect x="320" y="88" width="240" height="80" rx="6" fill="#f6f8f4"/>
  <rect x="320" y="88" width="240" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
  <rect x="332" y="100" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
  <text x="348" y="108" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SYNC</text>
  <text x="440" y="128" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Evidence Ingestion + Radar</text>
  <text x="440" y="148" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">index · primary · exhibits · immutable bytes</text>
  <text x="440" y="160" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">parse / failure · needs_review / digest</text>

  <!-- Node 3: Product -->
  <rect x="40" y="280" width="200" height="96" rx="6" fill="#f6f8f4"/>
  <rect x="40" y="280" width="200" height="96" rx="6" fill="rgba(102,112,105,.10)" stroke="#7a857d" stroke-width="1"/>
  <rect x="52" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(102,112,105,.55)" stroke-width=".8"/>
  <text x="68" y="300" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">APP</text>
  <text x="140" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">AgenticThesisEngine</text>
  <text x="140" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">typed Python interface</text>
  <text x="140" y="360" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">serve: FastAPI · Browser · SSE</text>

  <!-- Node 4: Retrieval -->
  <rect x="320" y="280" width="200" height="96" rx="6" fill="#f6f8f4"/>
  <rect x="320" y="280" width="200" height="96" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
  <rect x="332" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
  <text x="348" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RAG</text>
  <text x="420" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Hybrid Retrieval</text>
  <text x="420" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">structure windows · BM25 + Qdrant</text>
  <text x="420" y="360" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">claim + falsifier · RRF · rerank</text>

  <!-- Node 5: EvidencePack -->
  <rect x="560" y="280" width="200" height="96" rx="6" fill="#f6f8f4"/>
  <rect x="560" y="280" width="200" height="96" rx="6" fill="#e9f3ec" stroke="#276749" stroke-width="1.2"/>
  <rect x="572" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(39,103,73,.55)" stroke-width=".8"/>
  <text x="588" y="300" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CTX</text>
  <text x="660" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">EvidencePack</text>
  <text x="660" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sentence · list item · table row</text>
  <text x="660" y="360" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">exact spans · whole-atom token packing</text>

  <!-- Node 6: Structured analysis -->
  <rect x="800" y="280" width="200" height="96" rx="6" fill="#f6f8f4"/>
  <rect x="800" y="280" width="200" height="96" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
  <rect x="812" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
  <text x="828" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LLM</text>
  <text x="900" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Structured ThesisDelta</text>
  <text x="900" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API Structured Outputs · four states</text>
  <text x="900" y="360" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">claim deltas · evidence IDs · falsifier</text>

  <!-- Node 7: Validation -->
  <rect x="1040" y="280" width="160" height="96" rx="6" fill="#f6f8f4"/>
  <rect x="1040" y="280" width="160" height="96" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
  <rect x="1052" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
  <text x="1068" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RULE</text>
  <text x="1120" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Integrity Gate</text>
  <text x="1120" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">exact span / source</text>
  <text x="1120" y="360" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">falsifier · exact claims</text>

  <!-- Node 8: Human Review and commit -->
  <rect x="880" y="432" width="320" height="80" rx="6" fill="#f6f8f4"/>
  <rect x="880" y="432" width="320" height="80" rx="6" fill="rgba(102,112,105,.10)" stroke="#667069" stroke-width="1"/>
  <rect x="892" y="444" width="32" height="12" rx="2" fill="transparent" stroke="rgba(102,112,105,.55)" stroke-width=".8"/>
  <text x="908" y="452" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HITL</text>
  <text x="1040" y="476" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Human Review → CAS Commit</text>
  <text x="1040" y="496" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">persist decision · approve / reject · vN+1 / conflict</text>

  <!-- Node 9: Durable state -->
  <rect x="320" y="592" width="880" height="80" rx="6" fill="#f6f8f4"/>
  <rect x="320" y="592" width="880" height="80" rx="6" fill="#e9f3ec" stroke="#276749" stroke-width="1.2"/>
  <rect x="332" y="604" width="32" height="12" rx="2" fill="transparent" stroke="rgba(39,103,73,.55)" stroke-width=".8"/>
  <text x="348" y="612" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DB</text>
  <text x="760" y="628" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">SQLite Durable State</text>
  <text x="760" y="648" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">events · artifact bytes + hashes · collection attempts · Radar decisions</text>
  <text x="760" y="664" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">replayable events · checkpoints · immutable snapshots + heads</text>

  <!-- Legend -->
  <line x1="40" y1="716" x2="1240" y2="716" stroke="#dce3dd" stroke-width=".8"/>
  <text x="40" y="736" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".14em">BOUNDARIES</text>
  <rect x="144" y="728" width="16" height="12" rx="2" fill="#e9f3ec" stroke="#276749" stroke-width="1"/>
  <text x="168" y="740" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Context / durable memory</text>
  <rect x="352" y="728" width="16" height="12" rx="2" fill="#ffffff" stroke="#172019" stroke-width="1"/>
  <text x="376" y="740" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Workflow step / deterministic boundary</text>
  <line x1="640" y1="736" x2="672" y2="736" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="684" y="740" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">User / external control</text>
  <text x="1240" y="740" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">NO MULTI-AGENT · NO QUEUE · NO LLM ON NO-CHANGE CHECKS</text>
</svg>
