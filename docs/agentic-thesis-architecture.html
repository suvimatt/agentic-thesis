<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgenticThesis system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f6f8f4;
      --ink: #172019;
      --muted: #667069;
      --accent: #276749;
      --sans: ui-sans-serif, system-ui, -apple-system, sans-serif;
      --serif: ui-serif, Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; padding: 40px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: min(1280px, 100%); margin: auto; overflow-x: auto; }
    .eyebrow { margin-bottom: 8px; color: var(--accent); font: 600 8px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 700 28px/1.12 var(--serif); letter-spacing: -.02em; }
    svg { display: block; width: 100%; min-width: 960px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · AgenticThesis</p>
    <h1>Stateful RAG with evidence gates and durable thesis memory</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentic-thesis-architecture-title agentic-thesis-architecture-desc">
      <title id="agentic-thesis-architecture-title">AgenticThesis system architecture</title>
      <desc id="agentic-thesis-architecture-desc">Architecture showing an asynchronous FastAPI interface driving a LangGraph workflow from hybrid retrieval through evidence packing, structured thesis analysis, citation validation, human review, compare-and-swap commit, and SQLite-backed checkpoint and versioned thesis state.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#667069"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#276749"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f6f8f4"/>

      <!-- Zones -->
      <rect x="280" y="64" width="960" height="520" rx="8" fill="rgba(23,32,25,.02)" stroke="rgba(23,32,25,.12)" stroke-width=".8"/>
      <rect x="304" y="68" width="144" height="16" rx="2" fill="#f6f8f4"/>
      <text x="376" y="80" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".14em">LANGGRAPH WORKFLOW</text>

      <!-- Connectors: primary flow -->
      <line x1="240" y1="320" x2="320" y2="320" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="410" y1="200" x2="410" y2="280" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="320" x2="560" y2="320" stroke="#276749" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="760" y1="320" x2="800" y2="320" stroke="#276749" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1000" y1="320" x2="1040" y2="320" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 1130,360 V 392 Q 1130,400 1122,400 H 908 Q 900,400 900,408 V 440" fill="none" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1000" y1="480" x2="1040" y2="480" stroke="#667069" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Durable state paths -->
      <line x1="800" y1="488" x2="760" y2="488" stroke="#667069" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 1130,520 V 560 Q 1130,568 1122,568 H 668 Q 660,568 660,560 V 520" fill="none" stroke="#276749" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels: masks keep labels off strokes -->
      <rect x="244" y="296" width="72" height="12" rx="2" fill="#f6f8f4"/>
      <text x="280" y="304" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">ASYNC RUN</text>
      <rect x="424" y="228" width="72" height="12" rx="2" fill="#f6f8f4"/>
      <text x="460" y="236" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">CLAIMS</text>
      <rect x="504" y="296" width="52" height="12" rx="2" fill="#f6f8f4"/>
      <text x="530" y="304" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">TOP-K</text>
      <rect x="764" y="296" width="32" height="12" rx="2" fill="#f6f8f4"/>
      <text x="780" y="304" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">JSON</text>
      <rect x="1004" y="296" width="32" height="12" rx="2" fill="#f6f8f4"/>
      <text x="1020" y="304" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">GATE</text>
      <rect x="1000" y="376" width="76" height="12" rx="2" fill="#f6f8f4"/>
      <text x="1038" y="384" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">INTERRUPT</text>
      <rect x="1004" y="456" width="32" height="12" rx="2" fill="#f6f8f4"/>
      <text x="1020" y="464" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">APPLY</text>
      <rect x="764" y="464" width="32" height="12" rx="2" fill="#f6f8f4"/>
      <text x="780" y="472" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">SAVE</text>
      <rect x="860" y="544" width="72" height="12" rx="2" fill="#f6f8f4"/>
      <text x="896" y="552" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing=".06em">CAS COMMIT</text>

      <!-- Node 1: Interface -->
      <rect x="40" y="280" width="200" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="40" y="280" width="200" height="80" rx="6" fill="rgba(102,112,105,.10)" stroke="#7a857d" stroke-width="1"/>
      <rect x="52" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(102,112,105,.55)" stroke-width=".8"/>
      <text x="68" y="300" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API</text>
      <text x="140" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Product UI + FastAPI</text>
      <text x="140" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">background task · SSE · review API</text>

      <!-- Node 2: Inputs -->
      <rect x="320" y="120" width="180" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="320" y="120" width="180" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <rect x="332" y="132" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
      <text x="348" y="140" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DATA</text>
      <text x="410" y="164" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">SEC monitor + manual files</text>
      <text x="410" y="184" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">current snapshot · stable chunk IDs</text>

      <!-- Node 3: Retrieval -->
      <rect x="320" y="280" width="180" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="320" y="280" width="180" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <rect x="332" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
      <text x="348" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RAG</text>
      <text x="410" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Hybrid Retrieval</text>
      <text x="410" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BM25 + Qdrant · RRF · API rerank</text>

      <!-- Node 4: Context pack (focal) -->
      <rect x="560" y="280" width="200" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="560" y="280" width="200" height="80" rx="6" fill="#e9f3ec" stroke="#276749" stroke-width="1.2"/>
      <rect x="572" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(39,103,73,.55)" stroke-width=".8"/>
      <text x="588" y="300" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CTX</text>
      <text x="660" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">EvidencePack</text>
      <text x="660" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">per-claim · extractive · ≤2,000 tokens</text>

      <!-- Node 5: Structured analysis -->
      <rect x="800" y="280" width="200" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="800" y="280" width="200" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <rect x="812" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
      <text x="828" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LLM</text>
      <text x="900" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Structured ThesisDelta</text>
      <text x="900" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4 states · evidence IDs · falsifier</text>

      <!-- Node 6: Validation -->
      <rect x="1040" y="280" width="180" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="1040" y="280" width="180" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <rect x="1052" y="292" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
      <text x="1068" y="300" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RULE</text>
      <text x="1130" y="324" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Citation Validator</text>
      <text x="1130" y="344" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">quote/source + falsifier checks</text>

      <!-- Node 7: Durable state (focal) -->
      <rect x="560" y="440" width="200" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="560" y="440" width="200" height="80" rx="6" fill="#e9f3ec" stroke="#276749" stroke-width="1.2"/>
      <rect x="572" y="452" width="32" height="12" rx="2" fill="transparent" stroke="rgba(39,103,73,.55)" stroke-width=".8"/>
      <text x="588" y="460" fill="#276749" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DB</text>
      <text x="660" y="484" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">SQLite Durable State</text>
      <text x="660" y="504" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">checkpoints · snapshots · thesis head</text>

      <!-- Node 8: Human review -->
      <rect x="800" y="440" width="200" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="800" y="440" width="200" height="80" rx="6" fill="rgba(102,112,105,.10)" stroke="#667069" stroke-width="1"/>
      <rect x="812" y="452" width="32" height="12" rx="2" fill="transparent" stroke="rgba(102,112,105,.55)" stroke-width=".8"/>
      <text x="828" y="460" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HITL</text>
      <text x="900" y="484" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Human Review</text>
      <text x="900" y="504" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt · approve / reject / edit</text>

      <!-- Node 9: Commit -->
      <rect x="1040" y="440" width="180" height="80" rx="6" fill="#f6f8f4"/>
      <rect x="1040" y="440" width="180" height="80" rx="6" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <rect x="1052" y="452" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,32,25,.40)" stroke-width=".8"/>
      <text x="1068" y="460" fill="#172019" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CAS</text>
      <text x="1130" y="484" fill="#172019" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">Versioned Commit</text>
      <text x="1130" y="504" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">vN+1 · reject · version_conflict</text>

      <!-- Legend -->
      <line x1="40" y1="624" x2="1240" y2="624" stroke="#dce3dd" stroke-width=".8"/>
      <text x="40" y="644" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" letter-spacing=".14em">BOUNDARIES</text>
      <rect x="40" y="660" width="16" height="12" rx="2" fill="#e9f3ec" stroke="#276749" stroke-width="1"/>
      <text x="64" y="672" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Context / durable memory</text>
      <rect x="248" y="660" width="16" height="12" rx="2" fill="#ffffff" stroke="#172019" stroke-width="1"/>
      <text x="272" y="672" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Deterministic or structured boundary</text>
      <line x1="520" y1="668" x2="552" y2="668" stroke="#276749" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="564" y="672" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Primary evidence flow</text>
      <line x1="736" y1="668" x2="768" y2="668" stroke="#667069" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="780" y="672" fill="#667069" font-size="8" font-family="ui-sans-serif,system-ui,sans-serif">Checkpoint / passive state</text>
      <text x="1240" y="672" fill="#667069" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">NO MULTI-AGENT · NO DISTRIBUTED QUEUE</text>
    </svg>
  </main>
</body>
</html>
