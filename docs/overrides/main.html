{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page %}{{ page.meta.title or page.title }} — {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{% if page %}{{ page.meta.description or config.site_description }}{% else %}{{ config.site_description }}{% endif %}">
  {% if page %}<meta property="og:url" content="{{ page.canonical_url }}">{% endif %}
  <meta name="twitter:card" content="summary">
{% endblock %}
